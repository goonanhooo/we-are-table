<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>we are table. host</title><link rel="stylesheet" href="/style.css"></head>
<body>
  <main class="host-panel">
    <header class="topbar"><b>we are table.</b><span id="unity-status" class="connection"></span></header>
    <h1>함께하기</h1>
    <section id="pc-invite" class="pc-invite"><strong>PC 방 코드</strong><code id="pc-code"></code><button id="pc-copy">복사</button></section>
    <section class="phone-invite">
      <img id="phone-qr" alt="폰 컨트롤러 공통 입장 QR">
      <div><h2>폰으로 함께하기</h2><p>같은 QR로 입장하고, 폰에서 다리를 고르세요.</p><code id="phone-code"></code><button id="phone-copy" type="button">링크 복사</button></div>
      <div id="host-slots" class="host-slots" aria-label="다리 사용 현황"></div>
    </section>
    <section class="watch-invite"><div><strong>같은 화면 보기</strong><code id="watch-code"></code><a id="watch-link" target="_blank" rel="noopener">관전 화면 열기</a><small id="viewer-count"></small></div><button id="watch-copy">링크 복사</button></section>
    <details class="host-settings"><summary>연결 주소</summary><input id="public-origin" type="url" placeholder="https://…"><button id="save-origin">적용</button></details>
    <output id="host-message" role="status"></output>
  </main>
  <script type="module" src="/host.mjs"></script>
</body>
</html>
