<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f2ed">
  <title>we are table. controller</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="controller">
    <header class="topbar"><b>we are table.</b><span id="connection" class="connection" aria-label="게임 연결 대기"></span><span id="game-state" class="sr-only" role="status">게임 대기</span></header>
    <section id="entry" class="entry">
      <form id="join-form" autocomplete="off">
        <label for="room-code">방 코드</label>
        <input id="room-code" inputmode="text" maxlength="9" autocapitalize="characters" spellcheck="false" placeholder="ABCD EFGH" required>
        <button class="main-button" type="submit">입장</button>
      </form>
    </section>
    <section id="play" hidden>
      <div class="play-head"><strong id="slot-name" class="sr-only" role="status">노란 다리</strong><button id="color-toggle" class="icon-button" type="button" aria-label="다리 색 표시 전환" aria-pressed="true">◉</button><button id="leave" class="icon-button leave" type="button" aria-label="방 나가기">×</button></div>
      <div id="table-stage" class="table-stage">
        <img id="table-image" src="/assets/table-start-colors.svg" alt="왼쪽 뒤 노랑, 오른쪽 뒤 파랑, 왼쪽 앞 초록, 오른쪽 앞 빨강 다리의 테이블" draggable="false">
        <div id="gyro-feedback" class="gyro-feedback"><div class="tilt-pad" aria-label="다리 기울기 방향"><span class="pad-front">앞</span><span class="pad-back">뒤</span><span class="pad-left">좌</span><span class="pad-right">우</span><span class="pad-cross"></span><span id="tilt-dot" class="tilt-dot"></span></div></div>
      </div>
      <div id="leg-key" class="leg-key" aria-label="조작할 다리 선택">
        <button type="button" data-leg="0" aria-label="노란 다리로 전환" aria-pressed="false"><span class="leg-glyph" aria-hidden="true"></span><span class="leg-check" aria-hidden="true">✓</span></button>
        <button type="button" data-leg="1" aria-label="파란 다리로 전환" aria-pressed="false"><span class="leg-glyph" aria-hidden="true"></span><span class="leg-check" aria-hidden="true">✓</span></button>
        <button type="button" data-leg="2" aria-label="초록 다리로 전환" aria-pressed="false"><span class="leg-glyph" aria-hidden="true"></span><span class="leg-check" aria-hidden="true">✓</span></button>
        <button type="button" data-leg="3" aria-label="빨간 다리로 전환" aria-pressed="false"><span class="leg-glyph" aria-hidden="true"></span><span class="leg-check" aria-hidden="true">✓</span></button>
      </div>
      <section id="gyro-panel" class="gyro-panel" data-state="off" aria-label="조작 방식">
        <span id="gyro-title" class="sr-only" role="status">터치 조작</span>
        <div class="motion-controls"><button id="sensor" class="motion-button" type="button">자이로 켜기</button><button id="recenter" class="motion-button calibrate-button" type="button" disabled hidden>수직 보정</button><button id="touch-switch" class="motion-button" type="button" hidden>터치</button></div>
        <small id="sensor-state" class="sensor-notice" role="status" hidden></small>
      </section>
      <div id="dpad" class="dpad"><button data-bit="1" class="up" aria-label="앞으로">↑</button><button data-bit="4" class="left" aria-label="왼쪽">←</button><button data-bit="8" class="right" aria-label="오른쪽">→</button><button data-bit="2" class="down" aria-label="뒤로">↓</button></div>
      <div id="ability-actions" class="stretch ability-actions" aria-label="현재 능력 조작" hidden>
        <button id="action-primary" class="action-button" data-bit="0" type="button"><span id="action-primary-symbol" class="action-symbol" aria-hidden="true"></span><span id="action-primary-label" class="action-label"></span></button>
        <button id="action-secondary" class="action-button" data-bit="0" type="button"><span id="action-secondary-symbol" class="action-symbol" aria-hidden="true"></span><span id="action-secondary-label" class="action-label"></span></button>
      </div>
    </section>
    <output id="message" role="status"></output>
  </main>
  <script type="module" src="/preview-mock.mjs"></script><!-- ?preview 일 때만 가짜 게임 연결(UI 미리보기용), 평소엔 아무 일도 안 함 -->
  <script type="module" src="/controller.mjs"></script>
</body>
</html>
