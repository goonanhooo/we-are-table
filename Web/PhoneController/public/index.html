<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f2ed">
  <title>we are table. controller</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="controller">
    <section id="entry" class="entry">
      <b class="brand">we are table.</b>
      <form id="join-form" autocomplete="off">
        <label for="room-code">방 코드</label>
        <input id="room-code" inputmode="text" maxlength="9" autocapitalize="characters" spellcheck="false" placeholder="ABCD EFGH" required>
        <button class="main-button" type="submit">입장</button>
      </form>
    </section>
    <section id="play" data-mode="keys" hidden>
      <header class="topbar">
        <span class="status"><span id="connection" class="signal" aria-hidden="true"><i></i><i></i><i></i></span><span id="game-state" role="status">연결 중</span></span>
        <span class="top-actions">
          <span id="modes" class="modes" role="group" aria-label="조작 방식">
            <button type="button" data-mode="keys" aria-pressed="true">기본</button>
            <button type="button" data-mode="gyro" aria-pressed="false">자이로</button>
            <button type="button" data-mode="stick" aria-pressed="false">조이스틱</button>
          </span>
          <button id="leave" class="leave" type="button" aria-label="방 나가기">×</button>
        </span>
      </header>
      <strong id="slot-name" class="sr-only" role="status">노란 다리</strong>
      <span id="gyro-title" class="sr-only" role="status">자이로 꺼짐</span>
      <div class="stage">
        <div id="keys" class="keys" aria-label="방향키">
          <button data-bit="1" class="up" aria-label="앞으로">↑</button>
          <button data-bit="4" class="left" aria-label="왼쪽">←</button>
          <button data-bit="2" class="down" aria-label="뒤로">↓</button>
          <button data-bit="8" class="right" aria-label="오른쪽">→</button>
        </div>
        <div id="pad" class="pad" aria-label="다리 방향"><span class="pad-cross"></span><span id="tilt-dot" class="tilt-dot"></span></div>
        <div id="gyro-controls" class="gyro-controls" data-state="off">
          <button id="recenter" class="soft-button" type="button" disabled>수직 보정</button>
          <button id="sensor" class="soft-button" type="button" hidden>센서 다시 연결</button>
          <small id="sensor-state" class="sensor-notice" role="status" hidden></small>
        </div>
      </div>
      <div id="ability-actions" class="ability-actions" aria-label="현재 능력 조작" hidden>
        <button id="action-primary" class="action-button" data-bit="0" type="button"><span id="action-primary-symbol" class="action-symbol" aria-hidden="true"></span><span id="action-primary-label" class="action-label"></span></button>
        <button id="action-secondary" class="action-button" data-bit="0" type="button"><span id="action-secondary-symbol" class="action-symbol" aria-hidden="true"></span><span id="action-secondary-label" class="action-label"></span></button>
      </div>
      <footer class="dock">
        <div class="mini" aria-hidden="true">
          <span id="mini-pad" class="mini-pad"><span class="pad-cross"></span><span id="mini-dot" class="tilt-dot"></span></span>
          <span id="mini-keys" class="mini-keys"><i data-dir="1"></i><i data-dir="4"></i><i data-dir="2"></i><i data-dir="8"></i></span>
        </div>
        <div class="dock-center">
          <div id="leg-key" class="leg-key" role="group" aria-label="조작할 다리 선택">
            <button type="button" data-leg="0" aria-label="노란 다리로 전환" aria-pressed="false"></button>
            <button type="button" data-leg="1" aria-label="파란 다리로 전환" aria-pressed="false"></button>
            <button type="button" data-leg="2" aria-label="초록 다리로 전환" aria-pressed="false"></button>
            <button type="button" data-leg="3" aria-label="빨간 다리로 전환" aria-pressed="false"></button>
          </div>
          <input id="nickname" class="nickname" maxlength="16" autocomplete="nickname" enterkeyhint="done" spellcheck="false" placeholder="닉네임" aria-label="닉네임">
        </div>
        <button id="color-toggle" class="table-button" type="button" aria-label="다리 색 표시 전환" aria-pressed="true"><img id="table-image" src="/assets/table-start-colors.svg" alt="지금 테이블" draggable="false"></button>
      </footer>
    </section>
    <output id="message" role="status"></output>
  </main>
  <script type="module" src="/preview-mock.mjs"></script><!-- ?preview 일 때만 가짜 게임 연결(UI 미리보기용), 평소엔 아무 일도 안 함 -->
  <script type="module" src="/controller.mjs"></script>
</body>
</html>
